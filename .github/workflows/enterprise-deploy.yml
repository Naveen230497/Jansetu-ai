name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install flake8 pytest pytest-asyncio
        
    - name: Lint with flake8
      run: |
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Run Enterprise Security Audit (Bandit)
      run: |
        pip install bandit
        bandit -r backend -ll
        
  build-and-push:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Backend Docker Image
      run: docker build -t jansetu-backend:latest -f Dockerfile.backend .
      
    - name: Run Test Compose Stack
      run: docker compose up -d
      
    - name: Verify API Health
      run: |
        sleep 10
        curl -f http://localhost:8000/api/docs || (docker compose logs backend && exit 1)
